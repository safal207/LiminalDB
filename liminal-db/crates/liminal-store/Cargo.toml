[package]
name = "liminal-store"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
sha2 = "0.10"
thiserror = "1"
parking_lot = "0.12"
liminal-core = { path = "../liminal-core" }
ed25519-dalek = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
