name: Lotus Memory Import Contract

on:
  workflow_dispatch:
  push:
    branches:
      - agent/lotus-memory-import-contract-v0-2
    paths:
      - .github/workflows/lotus-memory-contract.yml
      - scripts/validate_lotus_memory.py
      - tests/test_validate_lotus_memory.py
      - fixtures/lotus/valid-events.jsonl
      - docs/integrations/LOTUS_MEMORY_IMPORT.md
      - benchmarks/fcrp-self-007.json
      - sdk/ts/src/protocol-types.ts
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/lotus-memory-contract.yml
      - scripts/validate_lotus_memory.py
      - tests/test_validate_lotus_memory.py
      - fixtures/lotus/valid-events.jsonl
      - docs/integrations/LOTUS_MEMORY_IMPORT.md
      - benchmarks/fcrp-self-007.json
      - sdk/ts/src/protocol-types.ts

permissions:
  contents: read

concurrency:
  group: lotus-memory-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify offline Lotus AuditEvent import contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONSUMER_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact subject revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CONSUMER_COMMIT }}
          persist-credentials: false

      - name: Validate exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONSUMER_COMMIT"
          echo "consumer_commit=$CONSUMER_COMMIT"
          echo "contract_blob=$(git hash-object sdk/ts/src/protocol-types.ts)"

      - name: Validate Python sources
        run: |
          set -euo pipefail
          python3 --version
          python3 -m py_compile \
            scripts/validate_lotus_memory.py \
            tests/test_validate_lotus_memory.py

      - name: Run contract regression tests
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_validate_lotus_memory.py -v

      - name: Validate fixture against current checked-out contract
        run: |
          set -euo pipefail
          mkdir -p reports/lotus
          python3 scripts/validate_lotus_memory.py \
            --events fixtures/lotus/valid-events.jsonl \
            --consumer-commit "$CONSUMER_COMMIT" \
            --output reports/lotus/import-check.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads(Path("reports/lotus/import-check.json").read_text())
          assert value["schema_version"] == "liminaldb-lotus-import-check-v0.2"
          assert value["mode"] == "dry_run"
          assert value["write_performed"] is False
          assert value["event_count"] == 2
          assert value["canonical_finding_count"] == 2
          assert value["authority"]["durable_memory_accepted"] is False
          assert value["authority"]["live_ingestion_performed"] is False
          c = value["compatibility"]
          assert c["consumer_commit"] == os.environ["CONSUMER_COMMIT"]
          assert c["contract_blob_matches_current_checkout"] is True
          assert c["historical_snapshot_is_semantic_key"] is False
          assert c["current_contract_blob_sha"] == "fd733971aaae089df770062bcf7f2c2d6d19ca1d"
          assert c["declared_adapter_commits"] == ["75ef9f7f403a34c60aa2ceba4cb3c97870d73e77"]
          PY
          test "$(git hash-object sdk/ts/src/protocol-types.ts)" = \
            "$(python3 -c 'import json; print(json.load(open("reports/lotus/import-check.json"))["compatibility"]["current_contract_blob_sha"])')"
          sha256sum \
            fixtures/lotus/valid-events.jsonl \
            reports/lotus/import-check.json \
            > reports/lotus/SHA256SUMS.txt

      - name: Verify FCRP-SELF-007 causal boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          case = json.loads(Path("benchmarks/fcrp-self-007.json").read_text())
          assert case["caseId"] == "FCRP-SELF-007"
          assert case["divergence"]["firstMeaningfulDivergence"] == "N1"
          assert case["divergence"]["selectedRefactorPoint"] == "N4"
          assert case["expectedProtocolDecision"] == "PASS"
          PY

      - name: Upload exact contract evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lotus-memory-import-contract-${{ github.run_id }}
          path: reports/lotus/
          if-no-files-found: error
          retention-days: 14
