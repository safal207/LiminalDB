name: Transition Ledger Safety Matrix

on:
  pull_request:
    branches:
      - main
      - feat/trustworthy-transition-ledger-v0.1
    paths:
      - 'liminal-db/crates/liminal-store/**'
      - '.github/workflows/transition-ledger-safety-matrix.yml'
  push:
    branches:
      - main
    paths:
      - 'liminal-db/crates/liminal-store/**'
      - '.github/workflows/transition-ledger-safety-matrix.yml'

permissions:
  contents: read

concurrency:
  group: transition-ledger-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger-safety:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: liminal-db
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: liminal-db

      - name: Compile liminal-store
        run: cargo check -p liminal-store

      - name: Execute canonical ledger fixture
        id: fixture
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cargo test -p liminal-store --test trustworthy_transition_fixture -- --nocapture > "../transition-ledger-fixture-${RUNNER_OS}.log" 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 120 "../transition-ledger-fixture-${RUNNER_OS}.log"
          exit "$status"

      - name: Upload fixture diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: transition-ledger-fixture-${{ runner.os }}-${{ github.run_id }}
          path: transition-ledger-fixture-${{ runner.os }}.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop on fixture failure
        if: ${{ steps.fixture.outputs.status != '0' }}
        run: exit 1

      - name: Exercise append fault boundaries
        if: ${{ steps.fixture.outputs.status == '0' }}
        run: cargo test -p liminal-store --features durability-test-hooks --test trustworthy_transition_fault_injection

      - name: Run ledger unit and restart tests
        if: ${{ steps.fixture.outputs.status == '0' }}
        run: cargo test -p liminal-store trustworthy_transition
