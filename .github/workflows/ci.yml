name: LiminalDB CI

on:
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'protocol/**'
      - 'sdk/rust/**'
      - 'conformance/**'
      - 'liminal-db/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Formatting advisory
        id: formatting
        continue-on-error: true
        run: cargo fmt --all --check

      - name: Cargo check (root workspace, all targets)
        id: cargo_check
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          cargo check --workspace --all-targets --locked 2>&1 | tee artifacts/cargo-check.txt

      - name: Upload cargo-check failure evidence
        if: steps.cargo_check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: root-workspace-cargo-check-failure
          path: artifacts/cargo-check.txt
          if-no-files-found: error
          retention-days: 14

      - name: Clippy (root workspace, all targets)
        if: steps.cargo_check.outcome == 'success'
        run: cargo clippy --workspace --all-targets --locked

      - name: Cargo test (root workspace)
        if: steps.cargo_check.outcome == 'success'
        run: cargo test --workspace --locked --no-fail-fast

      - name: Trustworthy-transition ledger restart demo
        if: steps.cargo_check.outcome == 'success'
        run: cargo run -q --locked -p liminal-store --example trustworthy_transition_ledger

      - name: Report inherited formatting debt
        if: steps.formatting.outcome == 'failure'
        run: >-
          echo "::warning title=Inherited Rust formatting debt::cargo fmt --all --check found pre-existing workspace drift. See issue #104; check, clippy, tests, and the restart demo remain blocking."

      - name: Fail closed on root-workspace check error
        if: steps.cargo_check.outcome == 'failure'
        run: exit 1
