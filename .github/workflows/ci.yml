name: LiminalDB CI

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'crates/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: liminal-db
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: liminal-db

      - name: Cargo check (workspace)
        run: cargo check --workspace

      - name: Cargo test (core + store)
        run: |
          cargo test -q -p liminal-core --no-fail-fast
          cargo test -q -p liminal-store --no-fail-fast

      - name: Trustworthy-transition ledger restart demo
        run: cargo run -q -p liminal-store --example trustworthy_transition_ledger

  pr89-final-durability:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/trustworthy-transition-ledger-v0.1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trustworthy-transition-ledger-v0.1
          fetch-depth: 0
          show-progress: false
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply guarded durability fixes
        run: |
          python3 .github/pr89_harden.py
          rustfmt --edition 2021 liminal-db/crates/liminal-store/src/wal.rs

      - name: Check workspace
        working-directory: liminal-db
        run: cargo check --workspace

      - name: Test liminal-store
        working-directory: liminal-db
        run: cargo test -q -p liminal-store --no-fail-fast

      - name: Commit validated hardening
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout d4275dbd65373e8160571f8429cc984302514dfd -- .github/workflows/ci.yml
          rm -f .github/pr89_harden.py
          rm -f .github/workflows/pr89-final-durability.yml
          rm -f .github/workflows/pr89-review-fixes-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden store directory durability"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feat/trustworthy-transition-ledger-v0.1
