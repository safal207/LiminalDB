name: LiminalDB CI

on:
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'protocol/**'
      - 'sdk/rust/**'
      - 'conformance/**'
      - 'liminal-db/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Formatting advisory
        id: formatting
        continue-on-error: true
        run: cargo fmt --all --check

      - name: Generate root lockfile candidate and check workspace
        id: cargo_check
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          cargo check --workspace --all-targets 2>&1 | tee artifacts/cargo-check.txt
          cp Cargo.lock artifacts/Cargo.lock

      - name: Upload root lockfile candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-workspace-lockfile-candidate
          path: |
            artifacts/Cargo.lock
            artifacts/cargo-check.txt
          if-no-files-found: error
          retention-days: 14

      - name: Report inherited formatting debt
        if: steps.formatting.outcome == 'failure'
        run: >-
          echo "::warning title=Inherited Rust formatting debt::cargo fmt --all --check found pre-existing workspace drift. See issue #104."

      - name: Stop after lockfile diagnostic
        if: always()
        run: exit 1
