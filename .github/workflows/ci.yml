name: LiminalDB CI

on:
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'protocol/**'
      - 'sdk/rust/**'
      - 'conformance/**'
      - 'liminal-db/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-root-lockfile:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/product-ci-evidence-hardening-v0-1'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Refresh and validate only the canonical root lockfile
        id: refresh
        shell: bash
        run: |
          cargo check --workspace --all-targets
          if git diff --quiet -- Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: synchronize root Cargo lockfile"
          git push origin HEAD:${{ github.head_ref }}
          echo "changed=true" >> "$GITHUB_OUTPUT"

  workspace:
    needs: refresh-root-lockfile
    if: needs.refresh-root-lockfile.outputs.changed == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Formatting advisory
        id: formatting
        continue-on-error: true
        run: cargo fmt --all --check

      - name: Cargo check (root workspace, all targets)
        run: cargo check --workspace --all-targets --locked

      - name: Clippy (root workspace, all targets)
        run: cargo clippy --workspace --all-targets --locked

      - name: Cargo test (root workspace)
        run: cargo test --workspace --locked --no-fail-fast

      - name: Trustworthy-transition ledger restart demo
        run: cargo run -q --locked -p liminal-store --example trustworthy_transition_ledger

      - name: Report inherited formatting debt
        if: steps.formatting.outcome == 'failure'
        run: >-
          echo "::warning title=Inherited Rust formatting debt::cargo fmt --all --check found pre-existing workspace drift. See issue #104."
