name: LiminalDB CI

on:
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'protocol/**'
      - 'sdk/rust/**'
      - 'conformance/**'
      - 'liminal-db/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Formatting
        run: cargo fmt --all --check

      - name: Cargo check (root workspace, all targets)
        run: cargo check --workspace --all-targets --locked

      - name: Clippy (root workspace, all targets)
        run: cargo clippy --workspace --all-targets --locked

      - name: Cargo test (root workspace)
        run: cargo test --workspace --locked --no-fail-fast

      - name: Trustworthy-transition ledger restart demo
        run: cargo run -q --locked -p liminal-store --example trustworthy_transition_ledger
