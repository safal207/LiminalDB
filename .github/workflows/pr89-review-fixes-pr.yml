name: PR89 review fixes trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: github.head_ref == 'feat/trustworthy-transition-ledger-v0.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trustworthy-transition-ledger-v0.1
          fetch-depth: 1
          show-progress: false

      - name: Decode patches
        shell: bash
        run: |
          for file in .github/pr89-patches/*.b64; do
            base64 --decode "$file" > "${file%.b64}"
          done

      - name: Check and apply patches
        shell: bash
        run: |
          patches=(
            .github/pr89-patches/fixtures.patch
            .github/pr89-patches/wal-lock.patch
            .github/pr89-patches/wal-create-sync.patch
            .github/pr89-patches/wal-rotation.patch
            .github/pr89-patches/wal-directory.patch
            .github/pr89-patches/ledger-validation.patch
          )
          for patch in "${patches[@]}"; do
            git apply --check "$patch"
            git apply "$patch"
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        working-directory: liminal-db
        run: cargo fmt --all

      - name: Check workspace
        working-directory: liminal-db
        run: cargo check --workspace

      - name: Test liminal-store
        working-directory: liminal-db
        run: cargo test -q -p liminal-store --no-fail-fast

      - name: Commit validated fixes
        shell: bash
        run: |
          rm -rf .github/pr89-patches
          rm -f .github/pr89-patch-error.txt
          rm -f .github/workflows/pr89-review-fixes.yml
          rm -f .github/workflows/pr89-review-fixes-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address trustworthy ledger review findings"
          git push origin HEAD:feat/trustworthy-transition-ledger-v0.1
