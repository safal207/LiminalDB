name: PR89 final durability

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'feat/trustworthy-transition-ledger-v0.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trustworthy-transition-ledger-v0.1
          fetch-depth: 0
          show-progress: false
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply guarded durability fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("liminal-db/crates/liminal-store/src/wal.rs")
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '''        let root = path.as_ref().to_path_buf();
        create_dir_all(&root)?;
        let writer_lock = acquire_writer_lock(&root)?;
        let data_dir = root.join("data");
        let snap_dir = root.join("snap");
        create_dir_all(&data_dir)?;
        create_dir_all(&snap_dir)?;
''',
              '''        let root = path.as_ref().to_path_buf();
        create_dir_all_durable(&root)?;
        let writer_lock = acquire_writer_lock(&root)?;
        let data_dir = root.join("data");
        let snap_dir = root.join("snap");
        create_dir_all_durable(&data_dir)?;
        create_dir_all_durable(&snap_dir)?;
''',
              "durable directories",
          )

          replace_once(
              '''fn acquire_writer_lock(root: &Path) -> Result<File> {
''',
              '''fn create_dir_all_durable(path: &Path) -> Result<()> {
    let mut missing = Vec::new();
    let mut current = path;
    while !current.exists() {
        missing.push(current.to_path_buf());
        let Some(parent) = current.parent() else {
            break;
        };
        if parent.as_os_str().is_empty() {
            break;
        }
        current = parent;
    }

    create_dir_all(path)?;
    for directory in missing.iter().rev() {
        let parent = directory.parent().unwrap_or_else(|| Path::new("."));
        let parent = if parent.as_os_str().is_empty() {
            Path::new(".")
        } else {
            parent
        };
        sync_directory(parent)?;
    }
    Ok(())
}

fn acquire_writer_lock(root: &Path) -> Result<File> {
''',
              "durable directory helper",
          )

          replace_once(
              '''#[cfg(windows)]
pub(crate) fn sync_directory(_path: &Path) -> Result<()> {
    Ok(())
}

#[cfg(not(any(unix, windows)))]
pub(crate) fn sync_directory(_path: &Path) -> Result<()> {
    Ok(())
}
''',
              '''#[cfg(windows)]
pub(crate) fn sync_directory(path: &Path) -> Result<()> {
    Err(anyhow!(
        "directory synchronization is unavailable on Windows for {path:?}"
    ))
}

#[cfg(not(any(unix, windows)))]
pub(crate) fn sync_directory(path: &Path) -> Result<()> {
    Err(anyhow!(
        "directory synchronization is unsupported on this platform for {path:?}"
    ))
}
''',
              "fail-closed directory sync",
          )

          replace_once(
              '''    #[test]
    fn wal_crc_detects_corruption() {
''',
              '''    #[test]
    fn second_writer_is_rejected_until_first_is_dropped() {
        let dir = tempdir().expect("tempdir");
        let first = Store::open(dir.path()).expect("first writer");
        assert!(Store::open(dir.path()).is_err(), "second writer must fail");
        drop(first);
        Store::open(dir.path()).expect("writer lock released on drop");
    }

    #[cfg(unix)]
    #[test]
    fn nested_store_directories_are_created_durably() {
        let dir = tempdir().expect("tempdir");
        let root = dir.path().join("nested/store/root");
        Store::open(&root).expect("open nested store");
        assert!(root.join("data").is_dir());
        assert!(root.join("snap").is_dir());
    }

    #[test]
    fn wal_crc_detects_corruption() {
''',
              "writer and directory tests",
          )

          path.write_text(text)
          PY

          rustfmt --edition 2021 liminal-db/crates/liminal-store/src/wal.rs

      - name: Check workspace
        working-directory: liminal-db
        run: cargo check --workspace

      - name: Test liminal-store
        working-directory: liminal-db
        run: cargo test -q -p liminal-store --no-fail-fast

      - name: Commit validated hardening
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/pr89-final-durability.yml
          rm .github/workflows/pr89-review-fixes-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden store directory durability"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feat/trustworthy-transition-ledger-v0.1
