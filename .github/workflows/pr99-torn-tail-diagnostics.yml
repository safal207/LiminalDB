name: PR99 Torn Tail Diagnostics

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr99-torn-tail-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: ${{ github.head_ref == 'agent/pr89-durability-fault-contract' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
          persist-credentials: false

      - name: Apply candidate patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_pr99_torn_tail_recovery.py
          cargo fmt --manifest-path liminal-db/Cargo.toml --all

      - name: Compile recovery contract
        working-directory: liminal-db
        run: cargo check -p liminal-store --features durability-test-hooks

      - name: Run append fault tests
        working-directory: liminal-db
        run: cargo test -p liminal-store --features durability-test-hooks --test trustworthy_transition_fault_injection -- --nocapture

      - name: Run canonical fixture
        working-directory: liminal-db
        run: cargo test -p liminal-store --test trustworthy_transition_fixture -- --nocapture

      - name: Run WAL tests
        working-directory: liminal-db
        run: cargo test -p liminal-store wal::tests -- --nocapture

      - name: Run transition tests
        working-directory: liminal-db
        run: cargo test -p liminal-store trustworthy_transition -- --nocapture
