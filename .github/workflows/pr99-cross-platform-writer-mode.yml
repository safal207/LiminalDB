name: PR99 Cross Platform Writer Mode

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: write

concurrency:
  group: pr99-cross-platform-writer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-push:
    if: ${{ github.head_ref == 'agent/pr89-durability-fault-contract' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
          persist-credentials: false

      - name: Apply writer mode patch
        id: patch
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -q '\[cross-platform-writer\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python .github/scripts/apply_pr99_cross_platform_writer_mode.py
          cargo fmt --manifest-path liminal-db/Cargo.toml --all
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Compile liminal-store
        if: ${{ steps.patch.outputs.skip != 'true' }}
        working-directory: liminal-db
        run: cargo check -p liminal-store --features durability-test-hooks

      - name: Validate all WAL failure transitions
        if: ${{ steps.patch.outputs.skip != 'true' }}
        working-directory: liminal-db
        run: cargo test -p liminal-store --features durability-test-hooks --test trustworthy_transition_fault_injection -- --nocapture

      - name: Validate WAL regressions
        if: ${{ steps.patch.outputs.skip != 'true' }}
        working-directory: liminal-db
        run: cargo test -p liminal-store wal::tests -- --nocapture

      - name: Validate transition replay
        if: ${{ steps.patch.outputs.skip != 'true' }}
        working-directory: liminal-db
        run: |
          cargo test -p liminal-store --test trustworthy_transition_fixture -- --nocapture
          cargo test -p liminal-store trustworthy_transition -- --nocapture

      - name: Commit validated writer mode
        if: ${{ steps.patch.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          git config user.name "pr99-safety-bot"
          git config user.email "actions@users.noreply.github.com"
          git add liminal-db/crates/liminal-store/src/wal.rs
          git commit -m "fix: use cross-platform WAL writer handle [cross-platform-writer]"

      - name: Push exact validated commit
        if: ${{ steps.patch.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_HEAD_REF}
