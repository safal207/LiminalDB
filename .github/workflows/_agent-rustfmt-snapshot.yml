name: Agent apply root rustfmt

on:
  push:
    branches:
      - agent/root-rustfmt-clean-v0-1

permissions:
  contents: write

concurrency:
  group: agent-root-rustfmt-clean-v0-1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout formatter branch
        uses: actions/checkout@v6
        with:
          ref: agent/root-rustfmt-clean-v0-1
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply canonical formatting once
        run: cargo fmt --all

      - name: Prove exact formatting-only scope
        shell: bash
        run: |
          git rm .github/workflows/_agent-rustfmt-snapshot.yml

          git diff --name-only --diff-filter=ACMD | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          .github/workflows/_agent-rustfmt-snapshot.yml
          conformance/src/main.rs
          liminal-db/crates/liminal-bridge-net/src/peers.rs
          liminal-db/crates/liminal-core/src/lql.rs
          liminal-db/crates/liminal-core/src/reflex/feedback.rs
          liminal-db/crates/liminal-sensor/src/host.rs
          liminal-db/crates/liminal-store/examples/trustworthy_transition_ledger.rs
          liminal-db/crates/liminal-store/examples/verified_negative_crash_harness.rs
          liminal-db/crates/liminal-store/examples/verified_negative_recover_inspect.rs
          protocol/src/lib.rs
          sdk/rust/examples/iot-benchmark.rs
          sdk/rust/examples/seeds_demo.rs
          sdk/rust/src/lib.rs
          sdk/rust/src/protocol.rs
          EOF

          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          cargo fmt --all --check
          git diff --check

      - name: Commit exact formatter result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format complete root workspace"
          git push origin HEAD:agent/root-rustfmt-clean-v0-1
