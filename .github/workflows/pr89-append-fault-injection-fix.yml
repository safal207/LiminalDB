name: PR89 Append Fault Injection Fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: write

concurrency:
  group: pr89-append-fault-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-validate-push:
    if: ${{ github.head_ref == 'feat/trustworthy-transition-ledger-v0.1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
          persist-credentials: false

      - name: Apply fail-closed test-hook patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -q '\[append-fault-hooks\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          cargo_path = Path("liminal-db/crates/liminal-store/Cargo.toml")
          cargo = cargo_path.read_text()
          cargo = replace_once(
              cargo,
              'edition = "2021"\n\n[dependencies]\n',
              'edition = "2021"\n\n[features]\ndurability-test-hooks = []\n\n[dependencies]\n',
              "add durability test feature",
          )
          cargo_path.write_text(cargo)

          lib_path = Path("liminal-db/crates/liminal-store/src/lib.rs")
          lib = lib_path.read_text()
          lib = replace_once(
              lib,
              'pub use wal::{Offset, Store, WalStream};\n',
              '#[cfg(feature = "durability-test-hooks")]\n'
              'pub use wal::{set_append_failpoint_for_test, AppendFailpoint};\n'
              'pub use wal::{Offset, Store, WalStream};\n',
              "export feature-gated fault hooks",
          )
          lib_path.write_text(lib)

          wal_path = Path("liminal-db/crates/liminal-store/src/wal.rs")
          wal = wal_path.read_text()
          wal = replace_once(
              wal,
              'use std::path::{Path, PathBuf};\n',
              'use std::path::{Path, PathBuf};\n'
              '#[cfg(any(test, feature = "durability-test-hooks"))]\n'
              'use std::sync::atomic::{AtomicU8, Ordering};\n',
              "import test-hook atomics",
          )
          wal = replace_once(
              wal,
              'const WRITER_LOCK_FILE: &str = ".liminaldb-writer.lock";\n',
              'const WRITER_LOCK_FILE: &str = ".liminaldb-writer.lock";\n\n'
              '#[cfg(any(test, feature = "durability-test-hooks"))]\n'
              '#[derive(Debug, Clone, Copy, PartialEq, Eq)]\n'
              '#[repr(u8)]\n'
              'pub enum AppendFailpoint {\n'
              '    Disabled = 0,\n'
              '    BeforeWrite = 1,\n'
              '    AfterWriteBeforeSync = 2,\n'
              '    AfterSyncBeforeAck = 3,\n'
              '}\n\n'
              '#[cfg(any(test, feature = "durability-test-hooks"))]\n'
              'static APPEND_FAILPOINT: AtomicU8 = AtomicU8::new(AppendFailpoint::Disabled as u8);\n\n'
              '#[cfg(any(test, feature = "durability-test-hooks"))]\n'
              'pub fn set_append_failpoint_for_test(failpoint: AppendFailpoint) {\n'
              '    APPEND_FAILPOINT.store(failpoint as u8, Ordering::SeqCst);\n'
              '}\n\n'
              '#[cfg(any(test, feature = "durability-test-hooks"))]\n'
              'fn take_append_failpoint() -> AppendFailpoint {\n'
              '    match APPEND_FAILPOINT.swap(AppendFailpoint::Disabled as u8, Ordering::SeqCst) {\n'
              '        1 => AppendFailpoint::BeforeWrite,\n'
              '        2 => AppendFailpoint::AfterWriteBeforeSync,\n'
              '        3 => AppendFailpoint::AfterSyncBeforeAck,\n'
              '        _ => AppendFailpoint::Disabled,\n'
              '    }\n'
              '}\n',
              "add append failpoint contract",
          )
          wal = replace_once(
              wal,
              '''    pub fn append(&mut self, bytes: &[u8]) -> Result<Offset> {
                  let offset = self.writer.append(bytes)?;
                  self.writer.sync_all()?;
                  Ok(offset)
              }
          ''',
              '''    pub fn append(&mut self, bytes: &[u8]) -> Result<Offset> {
                  #[cfg(any(test, feature = "durability-test-hooks"))]
                  let failpoint = take_append_failpoint();

                  #[cfg(any(test, feature = "durability-test-hooks"))]
                  if failpoint == AppendFailpoint::BeforeWrite {
                      return Err(anyhow!("injected append failure before WAL write"));
                  }

                  let offset = self.writer.append(bytes)?;

                  #[cfg(any(test, feature = "durability-test-hooks"))]
                  if failpoint == AppendFailpoint::AfterWriteBeforeSync {
                      return Err(anyhow!("injected append failure after WAL write before sync"));
                  }

                  self.writer.sync_all()?;

                  #[cfg(any(test, feature = "durability-test-hooks"))]
                  if failpoint == AppendFailpoint::AfterSyncBeforeAck {
                      return Err(anyhow!("injected append failure after sync before acknowledgement"));
                  }

                  Ok(offset)
              }
          ''',
              "inject append boundary failures",
          )
          wal_path.write_text(wal)

          matrix_path = Path(".github/workflows/transition-ledger-safety-matrix.yml")
          matrix = matrix_path.read_text()
          matrix = replace_once(
              matrix,
              '''      - name: Run ledger unit and restart tests
                  if: ${{ steps.fixture.outputs.status == '0' }}
                  run: cargo test -p liminal-store trustworthy_transition
          ''',
              '''      - name: Exercise append fault boundaries
                  if: ${{ steps.fixture.outputs.status == '0' }}
                  run: cargo test -p liminal-store --features durability-test-hooks --test trustworthy_transition_fault_injection

                - name: Run ledger unit and restart tests
                  if: ${{ steps.fixture.outputs.status == '0' }}
                  run: cargo test -p liminal-store trustworthy_transition
          ''',
              "add cross-platform fault-injection gate",
          )
          matrix_path.write_text(matrix)
          PY

          cat > liminal-db/crates/liminal-store/tests/trustworthy_transition_fault_injection.rs <<'RS'
          #![cfg(feature = "durability-test-hooks")]

          use liminal_store::{
              set_append_failpoint_for_test, sha256_ref, AppendFailpoint, TransitionEventInput,
              TransitionLedgerError, TransitionLinks, TransitionRecordKind,
              TrustworthyTransitionLedger,
          };
          use tempfile::tempdir;

          fn authorization(label: &str) -> TransitionEventInput {
              TransitionEventInput {
                  transition_id: format!("transition-{label}"),
                  subject_id: "agent:fault-injection".to_owned(),
                  kind: TransitionRecordKind::Authorization,
                  record_ref: sha256_ref(format!("record:{label}").as_bytes()),
                  payload_digest: sha256_ref(format!("payload:{label}").as_bytes()),
                  links: TransitionLinks::default(),
                  dimensions: None,
                  side_effect_committed: None,
                  captured_at_ms: 1,
              }
          }

          #[test]
          fn append_failures_poison_until_reopen_and_replay() {
              let cases = [
                  (AppendFailpoint::BeforeWrite, 0usize),
                  (AppendFailpoint::AfterWriteBeforeSync, 1usize),
                  (AppendFailpoint::AfterSyncBeforeAck, 1usize),
              ];

              for (index, (failpoint, expected_recovered_events)) in cases.into_iter().enumerate() {
                  let root = tempdir().expect("tempdir");
                  let mut ledger = TrustworthyTransitionLedger::open(root.path()).expect("open");

                  set_append_failpoint_for_test(failpoint);
                  let first_error = ledger
                      .append(authorization(&format!("first-{index}")))
                      .expect_err("injected append must fail");
                  assert!(matches!(first_error, TransitionLedgerError::Storage(_)));

                  let poisoned_error = ledger
                      .append(authorization(&format!("second-{index}")))
                      .expect_err("poisoned ledger must reject further append");
                  assert!(matches!(
                      poisoned_error,
                      TransitionLedgerError::PoisonedAfterStorageFailure
                  ));
                  drop(ledger);

                  let recovered =
                      TrustworthyTransitionLedger::open(root.path()).expect("reopen and replay");
                  assert_eq!(
                      recovered.event_count(),
                      expected_recovered_events,
                      "unexpected replay result for {failpoint:?}"
                  );
              }
          }
          RS

          cargo fmt --manifest-path liminal-db/Cargo.toml --all
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Validate fault-injection contract
        if: ${{ steps.patch.outputs.skip != 'true' }}
        working-directory: liminal-db
        run: |
          cargo check -p liminal-store --features durability-test-hooks
          cargo test -p liminal-store --features durability-test-hooks --test trustworthy_transition_fault_injection
          cargo test -p liminal-store --test trustworthy_transition_fixture
          cargo test -p liminal-store trustworthy_transition

      - name: Commit validated contract
        if: ${{ steps.patch.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pr89-safety-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/transition-ledger-safety-matrix.yml \
                  liminal-db/crates/liminal-store/Cargo.toml \
                  liminal-db/crates/liminal-store/src/lib.rs \
                  liminal-db/crates/liminal-store/src/wal.rs \
                  liminal-db/crates/liminal-store/tests/trustworthy_transition_fault_injection.rs
          git commit -m "test: inject append durability failures [append-fault-hooks]"

      - name: Push exact validated commit
        if: ${{ steps.patch.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:${GITHUB_HEAD_REF}
