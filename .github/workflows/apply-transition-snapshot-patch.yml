name: Apply Transition Snapshot Patch

on:
  push:
    branches: [feat/durability-matrix-v0-1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/durability-matrix-v0-1
          fetch-depth: 0

      - name: Route ledger snapshots through crash-safe replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('liminal-db/crates/liminal-store/src/trustworthy_transition.rs')
          text = source.read_text(encoding='utf-8')
          start = text.index('fn atomic_write(')
          end = text.index('\nfn sync_current_wal', start)
          replacement = '''fn atomic_write(path: &Path, bytes: &[u8]) -> Result<(), TransitionLedgerError> {
              crate::snapshot_durability::replace_snapshot_bytes_crash_safe(path, bytes)
          }
          '''
          source.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          Path('.github/workflows/apply-transition-snapshot-patch.yml').unlink()
          PY

      - name: Commit source patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: route ledger snapshots through crash-safe replacement"
          git push origin HEAD:feat/durability-matrix-v0-1
