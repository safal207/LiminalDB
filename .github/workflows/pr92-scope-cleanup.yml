name: PR92 Scope Cleanup

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pr92-scope-cleanup.yml'

permissions:
  contents: write

concurrency:
  group: pr92-scope-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  clean-validate-push:
    if: ${{ github.head_ref == 'feat/checkpoint-anchors-v0-1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/checkpoint-anchors-v0-1
          fetch-depth: 0
          persist-credentials: false

      - name: Restore unrelated files from main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            liminal-db/Cargo.lock \
            liminal-db/crates/liminal-bridge-net/src/peers.rs \
            liminal-db/crates/liminal-core/src/lql.rs \
            liminal-db/crates/liminal-core/src/reflex/feedback.rs \
            liminal-db/crates/liminal-sensor/src/host.rs \
            liminal-db/crates/liminal-store/examples/trustworthy_transition_ledger.rs

      - name: Validate checkpoint and ledger behavior
        working-directory: liminal-db
        run: |
          set -euo pipefail
          cargo check -p liminal-store
          cargo test -q -p liminal-store --no-fail-fast

      - name: Restore lockfile after ephemeral dependency resolution
        run: git checkout origin/main -- liminal-db/Cargo.lock

      - name: Remove temporary cleanup workflow
        run: rm .github/workflows/pr92-scope-cleanup.yml

      - name: Commit and push clean scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: restore PR92 checkpoint-only scope"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:feat/checkpoint-anchors-v0-1
