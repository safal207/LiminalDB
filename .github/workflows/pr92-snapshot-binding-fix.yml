name: PR92 Snapshot Binding Fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - '.github/scripts/apply_pr92_snapshot_binding.py'
      - '.github/workflows/pr92-snapshot-binding-fix.yml'

permissions:
  contents: write

concurrency:
  group: pr92-snapshot-binding-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-validate-push:
    if: ${{ github.head_ref == 'feat/checkpoint-anchors-v0-1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/checkpoint-anchors-v0-1
          fetch-depth: 0
          persist-credentials: false

      - name: Apply guarded snapshot binding fix
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_pr92_snapshot_binding.py
          cargo fmt --manifest-path liminal-db/Cargo.toml --all

      - name: Check liminal-store
        id: check
        continue-on-error: true
        working-directory: liminal-db
        run: |
          set +e
          cargo check -p liminal-store > ../pr92-cargo-check.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 200 ../pr92-cargo-check.log
          exit "$status"

      - name: Test checkpoint ledger integration
        id: integration
        if: ${{ steps.check.outputs.status == '0' }}
        continue-on-error: true
        working-directory: liminal-db
        run: |
          set +e
          cargo test -p liminal-store --test checkpoint_ledger_integration > ../pr92-integration.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 200 ../pr92-integration.log
          exit "$status"

      - name: Test checkpoint module
        id: checkpoint
        if: ${{ steps.check.outputs.status == '0' && steps.integration.outputs.status == '0' }}
        continue-on-error: true
        working-directory: liminal-db
        run: |
          set +e
          cargo test -p liminal-store checkpoint > ../pr92-checkpoint.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 200 ../pr92-checkpoint.log
          exit "$status"

      - name: Test trustworthy transition regressions
        id: transition
        if: ${{ steps.check.outputs.status == '0' && steps.integration.outputs.status == '0' && steps.checkpoint.outputs.status == '0' }}
        continue-on-error: true
        working-directory: liminal-db
        run: |
          set +e
          cargo test -p liminal-store trustworthy_transition > ../pr92-transition.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 200 ../pr92-transition.log
          exit "$status"

      - name: Upload validation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pr92-snapshot-binding-diagnostics-${{ github.run_id }}
          path: |
            pr92-cargo-check.log
            pr92-integration.log
            pr92-checkpoint.log
            pr92-transition.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop on validation failure
        if: ${{ steps.check.outputs.status != '0' || steps.integration.outputs.status != '0' || steps.checkpoint.outputs.status != '0' || steps.transition.outputs.status != '0' }}
        run: exit 1

      - name: Remove temporary patch machinery
        run: |
          rm .github/scripts/apply_pr92_snapshot_binding.py
          rm .github/workflows/pr92-snapshot-binding-fix.yml

      - name: Commit and push validated fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add liminal-db/crates/liminal-store/src/trustworthy_transition.rs
          git add liminal-db/crates/liminal-store/src/checkpoint.rs
          git add liminal-db/crates/liminal-store/tests/checkpoint_ledger_integration.rs
          git add .github/scripts/apply_pr92_snapshot_binding.py
          git add .github/workflows/pr92-snapshot-binding-fix.yml
          git commit -m "fix: bind checkpoint material to exact snapshot state"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:feat/checkpoint-anchors-v0-1
