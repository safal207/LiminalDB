name: Signed Checkpoint Conformance

on:
  pull_request:
    paths:
      - "liminal-db/crates/liminal-store/src/checkpoint.rs"
      - "liminal-db/crates/liminal-store/src/lib.rs"
      - "liminal-db/crates/liminal-store/Cargo.toml"
      - "liminal-db/crates/liminal-store/tests/checkpoint_ledger_integration.rs"
      - "liminal-db/crates/liminal-store/tests/fixtures/signed-checkpoint-*"
      - "docs/integrations/SIGNED_CHECKPOINT_*"
      - "scripts/pr92_trusted_time_fix.py"
      - ".github/workflows/signed-checkpoint-conformance.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr92-trusted-time-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  trusted-time-bootstrap:
    if: ${{ github.head_ref == 'feat/checkpoint-anchors-v0-1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/checkpoint-anchors-v0-1
          fetch-depth: 0
          persist-credentials: false

      - name: Apply one-shot trusted-time patch
        run: |
          set -euo pipefail
          if [[ -f scripts/pr92_trusted_time_fix.py ]]; then
            python3 scripts/pr92_trusted_time_fix.py
          else
            echo "Trusted-time patch helper already consumed."
          fi

      - name: Verify formatting
        run: cargo fmt --manifest-path liminal-db/Cargo.toml --all -- --check

      - name: Validate full liminal-store contract
        working-directory: liminal-db
        run: |
          set -euo pipefail
          cargo check -p liminal-store
          cargo test -q -p liminal-store --no-fail-fast

      - name: Remove one-shot helpers
        run: |
          rm -f scripts/pr92_trusted_time_fix.py
          rm -f .github/workflows/pr92-trusted-time-fix.yml

      - name: Commit validated correction when needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No correction remains to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bind checkpoint key lifecycle to trusted time"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:feat/checkpoint-anchors-v0-1
