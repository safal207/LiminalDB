name: Signed Checkpoint Conformance

on:
  pull_request:
    paths:
      - "liminal-db/crates/liminal-store/src/checkpoint.rs"
      - "liminal-db/crates/liminal-store/src/lib.rs"
      - "liminal-db/crates/liminal-store/Cargo.toml"
      - "liminal-db/crates/liminal-store/tests/checkpoint_ledger_integration.rs"
      - "liminal-db/crates/liminal-store/tests/fixtures/signed-checkpoint-*"
      - "liminal-db/crates/liminal-store/examples/signed_checkpoint_*"
      - "docs/integrations/SIGNED_CHECKPOINT_*"
      - ".github/workflows/signed-checkpoint-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: liminal-db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: liminal-db

      - name: Check liminal-store
        run: cargo check -p liminal-store

      - name: Test full liminal-store conformance
        id: tests
        continue-on-error: true
        run: |
          set +e
          cargo test -q -p liminal-store --no-fail-fast > signed-checkpoint-conformance.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 250 signed-checkpoint-conformance.log
          exit "$status"

      - name: Upload failure diagnostics
        if: ${{ steps.tests.outputs.status != '0' }}
        uses: actions/upload-artifact@v7
        with:
          name: signed-checkpoint-conformance-${{ github.run_id }}
          path: liminal-db/signed-checkpoint-conformance.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop on test failure
        if: ${{ steps.tests.outputs.status != '0' }}
        run: exit 1
