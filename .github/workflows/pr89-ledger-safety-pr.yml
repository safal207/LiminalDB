name: PR89 Ledger Safety PR

on:
  pull_request:
    branches:
      - main
      - feat/trustworthy-transition-ledger-v0.1
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: write

concurrency:
  group: pr89-ledger-safety-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-validate-push:
    if: ${{ github.head_ref == 'fix/pr89-ledger-safety-v1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
          persist-credentials: false

      - name: Apply bounded fix
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -q '\[pr89-fix-applied\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/apply_pr89_safety_fix.py
          cargo fmt --manifest-path liminal-db/Cargo.toml --all
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Compile liminal-store
        id: compile
        if: ${{ steps.patch.outputs.skip != 'true' }}
        continue-on-error: true
        working-directory: liminal-db
        shell: bash
        run: |
          set +e
          cargo check -p liminal-store > ../pr89-compile.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 80 ../pr89-compile.log
          exit "$status"

      - name: Upload compile diagnostics
        if: ${{ always() && steps.patch.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr89-compile-${{ github.run_id }}
          path: pr89-compile.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop on compile failure
        if: ${{ steps.patch.outputs.skip != 'true' && steps.compile.outputs.status != '0' }}
        run: exit 1

      - name: Execute trustworthy-transition fixture
        if: ${{ steps.patch.outputs.skip != 'true' && steps.compile.outputs.status == '0' }}
        working-directory: liminal-db
        run: cargo test -p liminal-store --test trustworthy_transition_fixture -- --nocapture

      - name: Run existing trustworthy-transition tests
        if: ${{ steps.patch.outputs.skip != 'true' && steps.compile.outputs.status == '0' }}
        working-directory: liminal-db
        run: cargo test -p liminal-store trustworthy_transition -- --nocapture

      - name: Commit validated production fixes
        if: ${{ steps.patch.outputs.skip != 'true' && steps.compile.outputs.status == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pr89-safety-bot"
          git config user.email "actions@users.noreply.github.com"
          git add liminal-db/crates/liminal-store/src/wal.rs \
                  liminal-db/crates/liminal-store/src/trustworthy_transition.rs \
                  liminal-db/crates/liminal-store/tests/trustworthy_transition_fixture.rs
          git commit -m "fix: harden transition ledger durability [pr89-fix-applied]"

      - name: Push exact validated commit
        if: ${{ steps.patch.outputs.skip != 'true' && steps.compile.outputs.status == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:${GITHUB_HEAD_REF}
