name: PR89 Windows Snapshot Fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: write

concurrency:
  group: pr89-windows-snapshot-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-validate-push:
    if: ${{ github.head_ref == 'fix/pr89-ledger-safety-v1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
          persist-credentials: false

      - name: Apply fail-closed portability patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -q '\[windows-snapshot-fix\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("liminal-db/crates/liminal-store/src/trustworthy_transition.rs")
          text = path.read_text()

          old_import = "use std::fs::{self, File, OpenOptions};"
          if text.count(old_import) != 1:
              raise SystemExit("remove direct directory File dependency: expected one match")
          text = text.replace(old_import, "use std::fs::{self, OpenOptions};", 1)

          pattern = re.compile(
              r"    File::open\(parent\)\n"
              r"\s+\.and_then\(\|directory\| directory\.sync_all\(\)\)\n"
              r"\s+\.map_err\(storage_error\)\?;\n"
          )
          text, count = pattern.subn(
              "    crate::wal::sync_directory(parent).map_err(storage_error)?;\n",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(
                  f"use platform-aware directory synchronization: expected one match, found {count}"
              )
          path.write_text(text)
          PY
          cargo fmt --manifest-path liminal-db/Cargo.toml --all
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Validate Ubuntu contract
        if: ${{ steps.patch.outputs.skip != 'true' }}
        working-directory: liminal-db
        run: |
          cargo check -p liminal-store
          cargo test -p liminal-store --test trustworthy_transition_fixture
          cargo test -p liminal-store trustworthy_transition

      - name: Commit validated fix
        if: ${{ steps.patch.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pr89-safety-bot"
          git config user.email "actions@users.noreply.github.com"
          git add liminal-db/crates/liminal-store/src/trustworthy_transition.rs
          git commit -m "fix: make snapshot directory sync platform-aware [windows-snapshot-fix]"

      - name: Push exact validated commit
        if: ${{ steps.patch.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:${GITHUB_HEAD_REF}
