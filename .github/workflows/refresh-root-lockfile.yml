name: Refresh root Cargo lockfile

on:
  push:
    branches:
      - agent/product-ci-evidence-hardening-v0-1
    paths:
      - .github/workflows/refresh-root-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: agent/product-ci-evidence-hardening-v0-1
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate and validate the canonical root lockfile
        run: cargo check --workspace --all-targets

      - name: Commit only Cargo.lock when changed
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: synchronize root Cargo lockfile"
          git push origin HEAD:agent/product-ci-evidence-hardening-v0-1
