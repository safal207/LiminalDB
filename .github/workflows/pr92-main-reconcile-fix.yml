name: PR92 Main Reconcile Fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pr92-main-reconcile-fix.yml'

permissions:
  contents: write

concurrency:
  group: pr92-main-reconcile-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge-validate-push:
    if: ${{ github.head_ref == 'feat/checkpoint-anchors-v0-1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/checkpoint-anchors-v0-1
          fetch-depth: 0
          persist-credentials: false

      - name: Merge current main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-commit --no-ff origin/main

      - name: Migrate snapshot fixture API
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('liminal-db/crates/liminal-store/tests/trustworthy_transition_fixture.rs')
          text = path.read_text()
          old = 'ledger.write_snapshot(2).expect("snapshot").path\n'
          new = '''ledger
                    .write_snapshot(2)
                    .expect("snapshot")
                    .path()
                    .to_path_buf()
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'fixture path migration expected one match, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove obsolete checkpoint digest helper
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('liminal-db/crates/liminal-store/src/checkpoint.rs')
          text = path.read_text()
          old = '''fn digest_cbor<T: Serialize>(value: &T) -> Result<String, CheckpointError> {
              Ok(sha256_ref(&canonical_bytes(value)?))
          }

          '''
          old = old.replace('              Ok', '    Ok').replace('          }', '}').replace('          \n', '\n')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'dead digest helper expected one match, found {count}')
          path.write_text(text.replace(old, '', 1))
          PY
          cargo fmt --manifest-path liminal-db/Cargo.toml --all

      - name: Validate full checkpoint and ledger crate
        working-directory: liminal-db
        run: |
          set -euo pipefail
          cargo check -p liminal-store
          cargo test -q -p liminal-store --no-fail-fast

      - name: Remove temporary reconcile workflow
        run: rm .github/workflows/pr92-main-reconcile-fix.yml

      - name: Commit merge and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "merge: reconcile checkpoint anchors with main"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:feat/checkpoint-anchors-v0-1
