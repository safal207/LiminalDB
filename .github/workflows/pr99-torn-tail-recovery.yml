name: PR99 Torn Tail Recovery

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: write

concurrency:
  group: pr99-torn-tail-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-validate-push:
    if: ${{ github.head_ref == 'agent/pr89-durability-fault-contract' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
          persist-credentials: false

      - name: Apply torn-tail recovery patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -q '\[torn-tail-recovery\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/scripts/apply_pr99_torn_tail_recovery.py
          cargo fmt --manifest-path liminal-db/Cargo.toml --all
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Validate recovery contract
        if: ${{ steps.patch.outputs.skip != 'true' }}
        working-directory: liminal-db
        run: |
          cargo check -p liminal-store --features durability-test-hooks
          cargo test -p liminal-store --features durability-test-hooks --test trustworthy_transition_fault_injection
          cargo test -p liminal-store --test trustworthy_transition_fixture
          cargo test -p liminal-store wal::tests
          cargo test -p liminal-store trustworthy_transition

      - name: Commit validated recovery
        if: ${{ steps.patch.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pr99-safety-bot"
          git config user.email "actions@users.noreply.github.com"
          git add liminal-db/crates/liminal-store/src/wal.rs \
                  liminal-db/crates/liminal-store/tests/trustworthy_transition_fault_injection.rs
          git commit -m "fix: recover torn WAL tail [torn-tail-recovery]"

      - name: Push exact validated commit
        if: ${{ steps.patch.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:${GITHUB_HEAD_REF}
